name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: cd client_app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v3
        with:
          name: chideeya-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
