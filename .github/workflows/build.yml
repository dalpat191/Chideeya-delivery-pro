name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Rebuild Android Folder
        run: |
          cd client_app
          rm -rf android
          flutter create --platforms=android .
      - name: Build APK
        run: |
          cd client_app
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chideeya-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
