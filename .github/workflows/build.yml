name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - name: Fix Project
        run: |
          cd client_app
          rm -rf android ios web
          flutter create --platforms=android --org com.chideeya --project-name chideeya_client.
          flutter pub get
      - name: Build APK
        run: |
          cd client_app
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: chideeya-client-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
