name: Build Rider APK

on:
  push:
    branches: [ main ]
    paths:
      - 'rider_app/**'
      - '.github/workflows/build-rider.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Rebuild Android Folder
        working-directory: rider_app
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Get Dependencies
        working-directory: rider_app
        run: flutter pub get

      - name: Build APK
        working-directory: rider_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chideeya-rider-apk
          path: rider_app/build/app/outputs/flutter-apk/app-release.apk